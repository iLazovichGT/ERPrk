<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Система учёта</title>

  <!-- Иконка на домашний экран iPhone. Эта страница НЕ в iframe (в отличие от GAS),
       поэтому Safari читает apple-touch-icon отсюда. Файл 180x180 без прозрачности.
       Пути ОТНОСИТЕЛЬНЫЕ — файлы лежат в этом же репозитории, домен не важен.
       ЗДЕСЬ запасной вариант «ЛП» (крупные буквы, лучше читается в мелком размере);
       основной (полный логотип) — index.html. Сменить иконку по умолчанию =
       заменить href ниже (или файл); уже установленные иконки обновятся только
       ПЕРЕустановкой (iOS запоминает картинку в момент добавления). -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-lp.png">

  <!-- Полноэкранный режим + подпись под иконкой -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Система учёта">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6FA">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F0F14">

  <style>
    /* Тема — по устройству (решение Ирины 16.07): светлая/тёмная как системная,
       цвета = токенам приложения (--bg/--t1: #F5F6FA/#1A1B2E и #0F0F14/#F0F0F5). */
    html, body {
      margin: 0; height: 100%;
      background: #F5F6FA;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1A1B2E;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
      -webkit-text-size-adjust: 100%;
      overflow: hidden; overscroll-behavior: none;
    }
    img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
    .t { font-size: 20px; font-weight: 700;
         background: linear-gradient(135deg, #6C5CE7, #A388EE);
         -webkit-background-clip: text; background-clip: text;
         -webkit-text-fill-color: transparent; }
    .s { font-size: 14px; opacity: .8; }
    a { color: #6C5CE7; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0F0F14; color: #F0F0F5; }
      a { color: #A388EE; }
      .t { background: none; -webkit-text-fill-color: currentColor; }
    }
    /* Приложение во весь экран поверх заставки (заставка видна, пока GAS грузится). */
    #app {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; z-index: 10; background: transparent;
    }
  </style>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // Обёртка = (1) иконка на «Домой» iPhone + (2) ХРАНИТЕЛЬ ВХОДА + (3) РАМКА.
    //
    // Почему хранитель здесь: приложение GAS живёт в стороннем iframe
    // (googleusercontent.com), а iOS в standalone-режиме (запуск с иконки)
    // НЕ сохраняет localStorage сторонних iframe между запусками — токен
    // «запомнить устройство» стирался, и логин/пароль спрашивало каждый раз.
    // localStorage ЭТОЙ страницы — первая сторона, живёт.
    //
    // Почему РАМКА (iframe), а не редирект: iOS показывает панели Safari
    // (адресная строка сверху + тулбар снизу), как только standalone-приложение
    // УХОДИТ с домена иконки на чужой домен. Держим приложение во весь экран
    // в iframe — верхний домен остаётся наш, панели не появляются. Токен
    // приложение возвращает postMessage'м (слушатель ниже); старый канал
    // «навигация на #app=X&st=…» сохранён для запуска обычной вкладкой Safari.
    //
    // ЭТОТ файл — обёртка РАЗРАБОТЧИКА (репо iLazovichGT/ERPrk, dev-приложение Ирины,
    // база TEST). Копия клиентской (LiderPOLirk/ERP) с одним отличием — адрес приложения.
    // Адрес обёртки зашит в коде системы как dev-умолчание (App_ui.jsx, 01_Main.gs, 05_Sync.gs).
    // Репо MyICO — склад иконок, к обёртке отношения больше не имеет.
    // ═══════════════════════════════════════════════════════════════════════

    // Белый список приложений (токен никуда, кроме них, не уйдёт).
    var APPS = {
      dev: "https://script.google.com/macros/s/AKfycbzkmQyfuE5iSTwk3-nLjt0ZZAud9vbTHuToTka-KV83zJ60LyAV0BXoyLaQ1k9PQhOI/exec"
    };
    var DEFAULT_APP = "dev";
    var LS_TOKEN = "liderp_st";   // база ключа токена; храним ПО ПРИЛОЖЕНИЯМ: liderp_st_dev
    var LS_APP   = "liderp_app";  // какое приложение запускаем с этого устройства

    // Параметры из query (?app=…) И из hash (#app=…&st=…/clear=1). Query важен для иконки:
    // iOS сохраняет URL страницы в момент добавления на «Домой» — вместе с ?app=…, поэтому
    // выбор приложения переживает запуск в standalone (localStorage Safari туда НЕ переносится).
    // Hash — канал команд от приложения ПРИ РЕДИРЕКТ-ЗАПУСКЕ (вкладка Safari): сохранить токен
    // (#app=X&st=…) / стереть (#app=X&clear=1). В iframe-режиме команды идут postMessage'м.
    var h = {};
    (location.search.replace(/^\?/, "") + "&" + location.hash.replace(/^#/, ""))
      .split("&").forEach(function (p) {
        if (!p) return;
        var i = p.indexOf("=");
        h[i < 0 ? p : p.slice(0, i)] = i < 0 ? "1" : decodeURIComponent(p.slice(i + 1));
      });
    if (h.app && APPS[h.app]) { try { localStorage.setItem(LS_APP, h.app); } catch (e) {} }

    var appKey = (h.app && APPS[h.app]) ? h.app : DEFAULT_APP;
    try { appKey = localStorage.getItem(LS_APP) || appKey; } catch (e) {}
    if (!APPS[appKey]) appKey = DEFAULT_APP;

    // Токен — отдельный ключ на каждое приложение.
    function tokenKey() { return LS_TOKEN + "_" + appKey; }
    function getToken() {
      var t = null;
      try { t = localStorage.getItem(tokenKey()); } catch (e) {}
      return t;
    }
    function setToken(t) {
      try { localStorage.setItem(tokenKey(), String(t)); } catch (e) {}
    }
    function clearToken() {
      try { localStorage.removeItem(tokenKey()); } catch (e) {}
    }
    // Пропуск СЛУЖЕБНОГО входа (автор/владелец, «Запомнить на этом устройстве», 09.10) — хранится
    // так же, как токен сотрудника, отдельным ключом. Подпись проверяет сервер, здесь только носим.
    function passKey() { return "liderp_sp_" + appKey; }
    function getPass() { try { return localStorage.getItem(passKey()); } catch (e) { return null; } }
    function setPass(p) { try { localStorage.setItem(passKey(), String(p)); } catch (e) {} }
    function clearPass() { try { localStorage.removeItem(passKey()); } catch (e) {} }

    // Команды старого канала (навигацией) — обрабатываем до построения ссылки.
    if (h.st)    setToken(h.st);
    if (h.clear) { clearToken(); clearPass(); }

    // Ссылка в приложение: ключ приложения + сохранённый токен (если есть).
    function appHref() {
      var t = getToken(), p = getPass();
      return APPS[appKey] + "?icon=" + appKey + (t ? "&st=" + encodeURIComponent(t) : "") +
             (p ? "&sp=" + encodeURIComponent(p) : "");
    }

    // Канал команд от приложения в iframe-режиме: postMessage {liderp:1, st:…|sp:…|clearsp:1|clear:1}.
    // clear («Выйти») стирает и токен сотрудника, и пропуск служебного входа.
    // Принимаем ТОЛЬКО от Google-доменов, где живёт наше приложение (iframe GAS —
    // *.googleusercontent.com, страница развёртывания — script.google.com).
    window.addEventListener("message", function (ev) {
      var d = ev.data || {};
      if (d.liderp !== 1) return;
      var okOrigin = ev.origin === "https://script.google.com" ||
                     /^https:\/\/[^\/]+\.googleusercontent\.com$/.test(ev.origin);
      if (!okOrigin) return;
      if (d.st)      setToken(d.st);
      if (d.sp)      setPass(d.sp);
      if (d.clearsp) clearPass();
      if (d.clear)   { clearToken(); clearPass(); }
    });

    // Определяем: открыто ли из иконки «Домой» (standalone) или обычной вкладкой Safari.
    var standalone = (window.navigator.standalone === true) ||
                     (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

    // Иконка «Домой» → приложение ВНУТРИ страницы (iframe): домен не меняется → нет панелей Safari.
    // &lo=1 после «Выйти» старым каналом: приложение НЕ автоопознаёт по Google эту загрузку.
    if (standalone) {
      document.addEventListener("DOMContentLoaded", function () {
        var f = document.createElement("iframe");
        f.id = "app";
        f.setAttribute("allow", "clipboard-write");
        f.src = appHref() + (h.clear ? "&lo=1" : "");
        document.body.appendChild(f);
      });
    } else if (h.st || h.clear) {
      // Вкладка Safari, вернулись командой от приложения (редирект-канал): записали/стёрли токен
      // выше — сразу обратно в приложение. После «Выйти» — с одноразовым &lo=1.
      location.replace(appHref() + (h.clear ? "&lo=1" : ""));
    }
  </script>
</head>
<body>
  <img src="apple-touch-icon-lp.png" alt="Система учёта">
  <div class="t">Система учёта</div>
  <div class="s" id="hint">Открываем приложение…</div>

  <script>
    // Обычная вкладка (не с иконки): на ТЕЛЕФОНЕ — инструкция «На экран Домой» + ссылка;
    // на ДЕСКТОПЕ инструкция бессмысленна (жалоба Ирины 16.07) — сразу открываем приложение.
    if (!standalone && !h.st && !h.clear) {
      var ua = navigator.userAgent || "";
      var isMobile = /iPhone|iPad|iPod|Android/i.test(ua) ||
                     (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPad прикидывается Mac
      if (isMobile) {
        document.getElementById('hint').innerHTML =
          'Нажмите «Поделиться» → «На экран „Домой"».<br><br>' +
          '<a href="' + appHref() + '">Или открыть приложение сейчас →</a>';
      } else {
        // Компьютер: встраиваем, как с иконки iPhone — адрес остаётся коротким, плашки Google
        // «создано пользователем Apps Script» нет, расширения не нужны (решение Ирины 08.10).
        // Работает только при доступе «Все» (анонимно) — так и у клиента, и на dev (с 09.10).
        var f = document.createElement("iframe");
        f.id = "app";
        f.setAttribute("allow", "clipboard-write");
        f.src = appHref();
        document.body.appendChild(f);
      }
    }
  </script>
</body>
</html>
